apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker-custom-hpa
  namespace: hotelease
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Pods
    pods:
      metric:
        name: worker_jobs_processed_total
      target:
        type: AverageValue
        averageValue: "5"
